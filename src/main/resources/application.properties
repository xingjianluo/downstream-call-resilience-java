server.port=0

# 整体编排时限（毫秒）
resilience.orchestration-deadline-ms=600

# 按下游分别生效的策略：inventory 健康；pricing 易超时/出错
resilience.policies.inventory.timeout-ms=300
resilience.policies.inventory.read-max-attempts=2
resilience.policies.inventory.write-max-attempts=2
resilience.policies.inventory.failure-threshold=3
resilience.policies.inventory.open-state-ms=500
resilience.policies.inventory.half-open-permits=1
resilience.policies.inventory.half-open-success-threshold=2
resilience.policies.inventory.retry-backoff-ms=20

resilience.policies.pricing.timeout-ms=120
resilience.policies.pricing.read-max-attempts=2
resilience.policies.pricing.write-max-attempts=2
resilience.policies.pricing.failure-threshold=3
resilience.policies.pricing.open-state-ms=500
resilience.policies.pricing.half-open-permits=2
resilience.policies.pricing.half-open-success-threshold=2
resilience.policies.pricing.retry-backoff-ms=10

# 本地模拟器脚本（按调用序号依次生效，用完循环最后一步）
resilience.sim.downstreams.inventory.idempotency-aware=true
resilience.sim.downstreams.inventory.steps[0].kind=OK
resilience.sim.downstreams.inventory.steps[0].value=item-1001

resilience.sim.downstreams.pricing.idempotency-aware=true
resilience.sim.downstreams.pricing.steps[0].kind=SLOW
resilience.sim.downstreams.pricing.steps[0].delay-ms=500
resilience.sim.downstreams.pricing.steps[0].value=price-99
