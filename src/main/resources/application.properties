server.port=0

# ===== 下游弹性策略（按下游名称分别生效）=====
# 健康读下游：200ms 超时，最多 2 次尝试，连续 5 次失败熔断，打开 2s 后半开 1 个探测
resilience.downstreams.profile-service.timeout-millis=200
resilience.downstreams.profile-service.max-attempts=2
resilience.downstreams.profile-service.retry-backoff-millis=20
resilience.downstreams.profile-service.failure-threshold=5
resilience.downstreams.profile-service.open-state-millis=2000
resilience.downstreams.profile-service.half-open-permits=1
resilience.downstreams.profile-service.operation-kind=READ

# 故障读下游：300ms 超时，最多 3 次尝试，阈值 3，便于演示快速熔断
resilience.downstreams.inventory-service.timeout-millis=300
resilience.downstreams.inventory-service.max-attempts=3
resilience.downstreams.inventory-service.retry-backoff-millis=20
resilience.downstreams.inventory-service.failure-threshold=3
resilience.downstreams.inventory-service.open-state-millis=800
resilience.downstreams.inventory-service.half-open-permits=1
resilience.downstreams.inventory-service.operation-kind=READ

# 幂等写下游：支持幂等键，超时可安全重试（服务器按幂等键去重）
resilience.downstreams.order-write-service.timeout-millis=400
resilience.downstreams.order-write-service.max-attempts=2
resilience.downstreams.order-write-service.retry-backoff-millis=20
resilience.downstreams.order-write-service.failure-threshold=4
resilience.downstreams.order-write-service.open-state-millis=1000
resilience.downstreams.order-write-service.half-open-permits=1
resilience.downstreams.order-write-service.operation-kind=IDEMPOTENT_WRITE

logging.level.com.github.xingjianluo=INFO
